# CI/CD CH-Api-Budgy — base commune : template rust QVL-ToolBox/PipeLine
include:
  - remote: "https://raw.githubusercontent.com/QVL-ToolBox/PipeLine/main/rust.gitlab-ci.yml"

stages:
  - test
  - build
  - deploy

# deploiement sur le serveur QVL : binaire -> /opt/custhome/ch-api-budgy + restart systemd
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  dependencies:
    - build
  script:
    - sudo /usr/local/bin/ch-deploy-bin ch-api-budgy "$CI_PROJECT_DIR/target/release/ch-api-budgy"

# override : scan du working-tree uniquement (les fixtures de test ont des valeurs
# d'exemple ; l'historique n'est pas re-scanne pour ces faux positifs deja revus)
secret-scan:
  variables:
    GIT_DEPTH: "1"
  script:
    - gitleaks detect --source . --no-git --no-banner --redact -v

# override : execution serialisee (evite les collisions sur bases/ports partages)
test:
  script:
    - cargo test -- --test-threads=1

# auto-pull du clone local persistant sur /mnt/c (evite les checkouts perimes)
#
# Deux pieges evites ici. D'abord `pull --ff-only origin main` avance la branche
# COURANTE : sur un clone reste sur une branche de travail, il faisait avancer
# celle-ci et laissait `main` gele, sans jamais le dire. Ensuite le fetch depend
# d'identifiants gitlab.com que le clone n'a pas forcement en cache, et l'echec
# passait inapercu. On se replace donc explicitement sur main, et on fetch avec
# le jeton du job.
update-checkout:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
  dependencies: []
  variables:
    CLONE_LOCAL: /mnt/c/QVL/QVL-CustHome/CH-Api-Budgy
  script:
    - git -C "$CLONE_LOCAL" fetch "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" main
    - git -C "$CLONE_LOCAL" checkout main
    - git -C "$CLONE_LOCAL" merge --ff-only FETCH_HEAD
    - git -C "$CLONE_LOCAL" log --oneline -1
